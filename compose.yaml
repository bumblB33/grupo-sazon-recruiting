services:
  api:
    build: .
    command: ["uvicorn", "screening_agent.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/screening_agent"]
    volumes:
      - ./screening_agent:/app/screening_agent:ro
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SCREENING_DATABASE_URL: mongodb://mongo:27017/screening
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sweep:
    build: .
    volumes:
      - ./screening_agent:/app/screening_agent:ro
    env_file: .env
    environment:
      SCREENING_DATABASE_URL: mongodb://mongo:27017/screening
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-300}
    command: ["sh", "-c", "while true; do screening-nudge; sleep \"$$SWEEP_INTERVAL_SECONDS\"; done"]
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Public URL for the stack. Opt in with `docker compose --profile tunnel up`.
  # ngrok's free plan gives each account one fixed dev domain; NGROK_URL is that domain.
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    command: ["http", "api:8000", "--url", "${NGROK_URL:?set NGROK_URL to the account's dev domain}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN from dashboard.ngrok.com}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
