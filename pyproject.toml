[project]
name = "screening-agent"
version = "0.1.0"
description = "AI candidate-screening agent for Grupo Sazón delivery-driver hiring"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "pydantic>=2.14",
    "pydantic-settings>=2.0",
    "fastapi>=0.162",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
    "pymongo>=4.10",
    "rapidfuzz>=3.14",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyjwt>=2.8",
    "logfire[fastapi,pymongo,httpx]>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.8", "testcontainers[mongodb]>=4.0", "pyright>=1.1.414"]
# Extra providers for the bake-off; the service itself only needs the provider in SCREENING_LIVE_MODEL.
evals = ["langchain-openai>=1.7", "langchain-mistralai>=1.1"]

[project.scripts]
screening-cli = "screening_agent.channels.chat_cli:main"
screening-nudge = "screening_agent.channels.nudge_cli:main"
screening-admin = "screening_agent.channels.admin_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["screening_agent*"]

[tool.setuptools.package-data]
"screening_agent.recruiter" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin exports test spans to Logfire whenever CI and LOGFIRE_TOKEN are both set.
addopts = "-p no:pytest_logfire"
pythonpath = ["."]

[tool.pyright]
include = ["screening_agent", "evals", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
# The formatter owns code line length; E501 only fires on template strings and prompts.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"screening_agent/api/*" = ["B008"]
"screening_agent/recruiter/*" = ["B008"]
