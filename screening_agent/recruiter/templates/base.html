<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Screening{% endblock %} - Grupo Sazón</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; color: #222; }
    header { background: #b3261e; color: #fff; padding: 10px 20px; display: flex; gap: 20px; align-items: center; }
    header a { color: #fff; }
    header form { margin-left: auto; }
    main { padding: 20px; max-width: 1100px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { background: #f5f5f5; }
    .badge { padding: 2px 8px; border-radius: 10px; background: #eee; font-size: 13px; white-space: nowrap; }
    .qualified { background: #d9f2dd; } .disqualified { background: #f8d7da; }
    .needs_recruiter_review { background: #fff3cd; } .abandoned { background: #e2e3e5; }
    .funnel span { margin-right: 14px; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    .transcript li { list-style: none; margin: 6px 0; padding: 6px 10px; border-radius: 8px; max-width: 70%; }
    .transcript .in { background: #e8f0fe; } .transcript .out { background: #f1f1f1; margin-left: auto; }
    .transcript { padding: 0; display: flex; flex-direction: column; }
    .meta { color: #666; font-size: 12px; }
    section { margin-bottom: 24px; }
    form.inline { display: inline; }
    label { display: block; margin: 8px 0 4px; }
    textarea { width: 100%; max-width: 600px; }
    button, select, input { font: inherit; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <header>
    <strong>Grupo Sazón screening</strong>
    <a href="/recruiter/">Candidates</a>
    {% block header %}<form method="post" action="/recruiter/logout"><button type="submit">Log out</button></form>{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
