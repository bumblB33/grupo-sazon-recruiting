{% extends "login_base.html" %}
{% block title %}{{ t.title_login }}{% endblock %}
{% block content %}
<div class="login card ticket reveal">
  <p class="kicker">{{ t.kicker }}</p>
  <h1>{{ t.heading_login }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/recruiter/login">
    <label for="email">{{ t.label_email }}</label>
    <input id="email" name="email" type="email" autocomplete="email" autofocus required>
    <button type="submit">{{ t.button_send_link }}</button>
  </form>
  {% include "_locale_links.html" %}
</div>
{% endblock %}
